<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Base orb: @oreo-design/avatar — createAvatar({ shape: "ellipse", palette: "peach-cream", variantId: "a1f3" }), background rect removed for transparency. Sparkle overlay + twinkle animation added on top. -->
  <style>
    @keyframes decStarBreathe {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.14) rotate(-10deg); }
    }
    @keyframes decPlusTwinkle {
      0%, 18% { transform: scale(0.4); opacity: 0.2; }
      45% { transform: scale(1.25); opacity: 1; }
      65% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(0.4); opacity: 0.2; }
    }
    #dec-star { transform-origin: 9.46px 10.48px; animation: decStarBreathe 2.8s ease-in-out infinite; }
    #dec-plus1 { transform-origin: 12.37px 5.75px; animation: decPlusTwinkle 2.8s ease-in-out infinite; }
    #dec-plus2 { transform-origin: 14.55px 7.93px; animation: decPlusTwinkle 2.8s ease-in-out -1.2s infinite; }
    @media (prefers-reduced-motion: reduce) {
      #dec-star, #dec-plus1, #dec-plus2 { animation: none; }
    }
  </style>
  <defs>
    <filter id="blur-1-oreo-arguya" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.1"/></filter>
    <filter id="blur-3-oreo-arguya" x="-55%" y="-55%" width="210%" height="210%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="blur-5-oreo-arguya" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5.1"/></filter>
    <filter id="blur-8-oreo-arguya" x="-85%" y="-85%" width="270%" height="270%"><feGaussianBlur stdDeviation="8.4"/></filter>
    <clipPath id="clip-oreo-arguya"><rect width="64" height="64" rx="32" fill="#ffffff"/></clipPath>
    <radialGradient id="edge-oreo-arguya" gradientUnits="userSpaceOnUse" cx="32" cy="32" r="32">
      <stop offset="98.4375%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="edge-mask-oreo-arguya" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="64" height="64" style="mask-type:alpha">
      <rect width="64" height="64" fill="url(#edge-oreo-arguya)"/>
    </mask>
    <linearGradient id="cream-oreo-arguya" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2ce"/><stop offset="100%" stop-color="#fffad4"/>
    </linearGradient>
    <linearGradient id="hot-oreo-arguya" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc744"/><stop offset="100%" stop-color="#ff6044"/>
    </linearGradient>
    <linearGradient id="sparkle-oreo-arguya" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc744"/><stop offset="100%" stop-color="#ff6044"/>
    </linearGradient>
  </defs>
