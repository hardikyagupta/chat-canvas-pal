<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dr-tube" x1="3" y1="16.5" x2="17.5" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- tripod legs -->
  <path d="M6.6 17.4 5 22" stroke="#334155" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M9.2 18.4 12.6 22" stroke="#334155" stroke-width="1.7" stroke-linecap="round"/>
  <!-- telescope tube (tilted up-right) -->
  <g transform="rotate(-30 12 12)">
    <rect x="3" y="10.4" width="14" height="5.2" rx="2.6" fill="url(#dr-tube)"/>
    <rect x="1.2" y="11.3" width="2.6" height="3.4" rx="1.1" fill="#1E40AF"/>
    <circle cx="16.4" cy="13" r="3.5" fill="#93C5FD"/>
    <circle cx="16.4" cy="13" r="1.9" fill="#EFF6FF"/>
  </g>
  <!-- star glint the telescope points at -->
  <path d="M20.4 3.4 21.1 5.5 23.2 6.2 21.1 6.9 20.4 9 19.7 6.9 17.6 6.2 19.7 5.5Z" fill="#FBBF24"/>
</svg>
